<svg xmlns="http://www.w3.org/2000/svg" width="168" height="56" viewBox="0 0 168 56">
<defs>
<filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="matrix" values="0 0 0 0 0.35 0 0 0 0 0.27 0 0 0 0 0.18 0 0 0 0.1 0"/></filter>
<clipPath id="clip"><rect x="8" y="8" width="152" height="40" rx="20"/></clipPath>
</defs>
<rect x="8.5" y="8.5" width="151" height="39" rx="20" fill="#F4EDE1" stroke="#DED1BC"/>
<rect x="8" y="8" width="152" height="40" clip-path="url(#clip)" filter="url(#grain)"/>
<foreignObject x="8" y="8" width="152" height="40"><div xmlns="http://www.w3.org/1999/xhtml" class="c"><style>@font-face{font-family:'Fraunces';font-weight:500;font-style:normal;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Inter';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Inter';font-weight:600;font-style:normal;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'JBM';font-weight:500;font-style:normal;src:url(data:font/woff2;base64,) format('woff2');}
.c{box-sizing:border-box;width:100%;height:100%;padding:26px 30px;display:flex;flex-direction:column;
  font-family:Inter,system-ui,sans-serif;color:#1E1A15;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.c *{box-sizing:border-box}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:500;margin:0;letter-spacing:-0.01em;color:#1E1A15}
p{margin:0}
.mono{font-family:JBM,ui-monospace,monospace;font-size:11px;letter-spacing:0.08em;color:#7A6E60;font-weight:500}
.acc{color:#B24A25}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#3E7A4F;margin-right:8px;vertical-align:1px;animation:pulse 2.4s ease-out infinite}
.foot{margin-top:auto;padding-top:14px;font-size:10.5px}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(62,122,79,.5)}70%{box-shadow:0 0 0 7px rgba(62,122,79,0)}100%{box-shadow:0 0 0 0 rgba(62,122,79,0)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}.d1{animation-delay:.15s}.d2{animation-delay:.3s}
@media (prefers-reduced-motion:reduce){.c *{animation:none!important}}
.c{padding:0;align-items:center;justify-content:center}.mono{font-size:12px;color:#1E1A15;letter-spacing:.1em}</style><span class="mono">EMAIL ↗</span></div></foreignObject>
</svg>
